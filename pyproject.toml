[tool.black]
line-length = 80
target-version = ["py310"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501 intentionally NOT ignored — see AGENTS.md's "Linting" section for rationale.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
